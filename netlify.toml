# Build y publicación para Netlify (Vite + React)
# Shared CJS helpers live in netlify/functions/shared/ — not packaged as HTTP functions.
[build]
  command = "npm run check"
  publish = "dist"

# Evita "Page not found" al refrescar en rutas como /admin, /marketplace
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
